<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fruit Chord Adventure</title>
<style>
*{box-sizing:border-box}
:root{--purple:#6330d8}
body{margin:0;min-height:100vh;font-family:"Nunito","Comic Sans MS",Arial,sans-serif;color:#5d36c7;background:radial-gradient(circle at 20% 8%,#fff 0 3%,transparent 14%),radial-gradient(circle at 85% 15%,#fff 0 3%,transparent 15%),linear-gradient(135deg,#f0e6ff,#fff 48%,#f0e8ff);overflow-x:hidden}
button{font-family:inherit}
.app{max-width:1500px;margin:auto;padding:10px 18px 18px}
.top{height:195px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.decor{position:absolute;bottom:-8px;z-index:1;object-fit:contain;filter:drop-shadow(0 8px 5px #6942a52a);pointer-events:none}
.straw{left:7%;width:190px;height:210px}.berry{left:23%;width:130px;height:145px}.grape{right:14%;width:170px;height:205px}.banana{right:5%;width:145px;height:185px}
.brand{position:relative;z-index:10;text-align:center;margin-top:-8px}
.brand-main{font-size:62px;line-height:.88;font-weight:1000;letter-spacing:-3px;color:#5f2ed5;text-shadow:0 5px 0 #fff,0 8px 10px #6330d844}
.brand-main .red{color:#e9252f}.brand-main .orange{color:#ff8516}.brand-main .yellow{color:#ffb900}.brand-main .blue{color:#2678e9}.brand-main .green{color:#39b73c}
.ribbon{display:inline-block;margin-top:8px;background:linear-gradient(180deg,#7a42e7,#5221c7);color:#fff;border:5px solid #fff;border-radius:14px;padding:8px 75px;font-size:34px;font-weight:1000;letter-spacing:2px;box-shadow:0 6px 0 #3f1aa7,0 10px 18px #5424bd44;transform:rotate(-2deg)}
.home,.sound{position:absolute;z-index:20;top:4px;border:0;background:#fff;border-radius:18px;color:#6030d5;font-weight:1000;font-size:17px;padding:12px 18px;box-shadow:0 4px 16px #6330d82b;cursor:pointer}
.home{left:0}.sound{right:0}.home b{display:block;font-size:40px;line-height:.75;margin-bottom:7px}
.panel{background:#ffffffee;border:3px solid #e1d4ff;border-radius:32px;box-shadow:0 12px 35px #6c42d42b;padding:13px 18px 18px}
.question{text-align:center}.question h1{margin:0;font-size:48px;line-height:1.05;color:#6630d8;font-weight:1000}.question p{margin:3px 0 12px;font-size:24px;font-weight:1000;color:#6131d1}
.piano-wrap{overflow-x:auto;padding:0 4px 10px}
.piano{position:relative;height:350px;min-width:1080px;border:3px solid #777;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 8px 0 #ddd}
.whites{position:absolute;inset:0;display:flex}
.white{position:relative;flex:1 0 0;height:100%;background:#fff;border-right:2px solid #aaa;display:flex;align-items:flex-end;justify-content:center;padding-bottom:43px;font-size:31px;font-weight:1000;overflow:hidden;z-index:1}
.white:last-child{border-right:0}
.white.active{background:linear-gradient(#c8b3ff,#b398f3);color:#5425c8;box-shadow:inset 0 -14px 0 #7040dc}
.note-C{color:#6932db}.note-D{color:#2f7be6}.note-E{color:#ef3f62}.note-F{color:#2caf5a}.note-G{color:#6732d8}.note-A{color:#ed7b13}.note-B{color:#2374dc}
.blacks{position:absolute;inset:0;z-index:5;pointer-events:none}
.black{position:absolute;top:0;transform:translateX(-50%);width:4.9%;height:185px;background:linear-gradient(90deg,#242532,#15151b);border:3px solid #17171d;border-top:0;border-radius:0 0 10px 10px;box-shadow:0 8px 12px #0004;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:47px;font-size:20px;font-weight:1000;z-index:6}
.black.active{background:linear-gradient(90deg,#7650e0,#5c35ca);box-shadow:0 0 0 4px #e9e1ff,0 9px 16px #7041db55}
.octaves{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0 17px}.oct{position:relative;text-align:center;color:#612bd4;font-size:20px;font-weight:1000;padding-top:7px}.oct:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:#6b31dc}.oct:after{content:"";position:absolute;top:-3px;left:0;width:3px;height:9px;background:#6b31dc;box-shadow:calc(100% - 3px) 0 0 #6b31dc}
.instruction{display:table;margin:11px auto 10px;background:#fffdf1;border:2px solid #ffe08b;border-radius:16px;padding:7px 25px;font-size:20px;font-weight:1000}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 20px}
.choice{min-height:112px;border:3px solid;border-radius:22px;background:#fff;font-size:25px;font-weight:1000;cursor:pointer;box-shadow:0 5px 12px #6d43b51b}.choice:nth-child(1){border-color:#ff6a72;color:#ed292e;background:#fff6f6}.choice:nth-child(2){border-color:#66a1f2;color:#2470d7;background:#f4f8ff}.choice:nth-child(3){border-color:#a16ce9;color:#5d2ed0;background:#faf6ff}.choice:nth-child(4){border-color:#e8b82e;color:#aa7600;background:#fffaf0}.choice:disabled{cursor:default;opacity:.9}.choice:hover:not(:disabled){transform:translateY(-2px)}
.message{height:46px;text-align:center;font-size:20px;font-weight:1000;padding:9px}.correct{color:#24964d}.wrong{color:#dc3b56}
.start,.restart{display:block;margin:2px auto 10px;border:0;border-radius:18px;padding:12px 28px;color:#fff;background:#7040dc;font-size:18px;font-weight:1000;box-shadow:0 5px 0 #4b22ac;cursor:pointer}.restart{display:none}
.stats{display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr;margin:0 20px;border-top:1px solid #e7ddff;padding-top:10px;gap:10px;align-items:center}.stat{font-size:18px;font-weight:1000;color:#5d2ed0;border-right:1px solid #e8ddff}.stat:last-child{border:0}.stat .big{font-size:30px;margin-right:6px}.stat small{display:block;font-size:13px}
@media(max-width:900px){.app{padding:5px}.top{height:145px}.decor{transform:scale(.72);transform-origin:bottom}.straw{left:0}.berry{left:17%}.grape{right:13%}.banana{right:0}.brand-main{font-size:43px}.ribbon{font-size:23px;padding:6px 35px}.home,.sound{font-size:12px;padding:8px 10px}.home b{font-size:28px}.panel{border-radius:22px;padding:9px 7px 12px}.question h1{font-size:34px}.question p{font-size:17px}.piano{height:250px;min-width:1000px}.white{font-size:22px;padding-bottom:30px}.black{height:140px;font-size:15px;padding-bottom:32px}.octaves{margin:0 8px}.oct{font-size:15px}.instruction{font-size:15px;padding:6px 12px}.answers{grid-template-columns:repeat(2,1fr);gap:8px;margin:0 4px}.choice{min-height:72px;font-size:17px;border-radius:16px}.stats{margin:0 4px;grid-template-columns:repeat(2,1fr)}.stat{border-right:0;font-size:14px}}
</style>

<style>
/* Compact full-screen layout: everything visible without vertical scrolling */
html,body{height:100%;overflow:hidden}
.app{height:100vh;box-sizing:border-box;max-width:1500px;padding:4px 14px 6px;display:flex;flex-direction:column;overflow:hidden}
.top{height:125px;min-height:125px}
.decor{transform:scale(.78);transform-origin:bottom center}
.straw{left:7%;width:160px;height:175px}.berry{left:23%;width:110px;height:125px}.grape{right:14%;width:145px;height:170px}.banana{right:5%;width:120px;height:155px}
.brand{margin-top:-4px}.brand-main{font-size:48px}.ribbon{margin-top:5px;padding:6px 58px;font-size:27px}
.home,.sound{top:2px;padding:9px 14px;font-size:15px}.home b{font-size:32px}
.panel{flex:1;min-height:0;padding:8px 12px 10px;border-radius:26px;display:flex;flex-direction:column;overflow:hidden}
.question h1{font-size:38px}.question p{margin:1px 0 7px;font-size:20px}
.piano-wrap{padding:0 3px 5px;overflow:hidden;flex:0 0 auto}.piano{height:275px;min-width:0;width:100%;border-radius:18px;box-shadow:0 6px 0 #ddd}
.white{padding-bottom:32px;font-size:27px}.black{height:145px;padding-bottom:34px;font-size:18px}
.octaves{display:none}
.instruction{margin:7px auto 7px;padding:5px 20px;font-size:17px}
.answers{gap:12px;margin:0 12px}.choice{min-height:78px;font-size:22px;border-radius:18px}
.message{height:28px;padding:4px;font-size:16px}
.start,.restart{margin:2px auto 6px;padding:9px 24px;font-size:16px}
.stats{margin:0 12px;padding-top:6px;gap:8px}.stat{font-size:16px}.stat .big{font-size:25px}.stat small{font-size:11px}
@media(max-width:900px){
 html,body{overflow:auto}
 .app{height:auto;min-height:100vh;padding:4px}.top{height:105px;min-height:105px}.decor{transform:scale(.58)}.brand-main{font-size:38px}.ribbon{font-size:20px;padding:5px 28px}.home,.sound{font-size:11px;padding:7px 8px}.home b{font-size:25px}
 .panel{padding:7px 5px 9px}.question h1{font-size:30px}.question p{font-size:15px}.piano-wrap{overflow-x:auto}.piano{height:235px;min-width:1000px}.white{font-size:21px;padding-bottom:27px}.black{height:130px;font-size:14px;padding-bottom:28px}.instruction{font-size:14px;padding:5px 10px}.answers{grid-template-columns:repeat(2,1fr);gap:7px;margin:0 3px}.choice{min-height:64px;font-size:16px}.stats{margin:0 3px;grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<div class="instruction">⭐ &nbsp;Nhìn các phím sáng và chọn tên hợp âm nhé! 👀</div>
<div class="answers" id="answers"></div><div class="message" id="message"></div>
<button class="start" id="start">▶ Bắt đầu chơi</button><button class="restart" id="restart">🔄 Chơi lại</button>
<div class="stats"><div class="stat"><span class="big">🎯</span>Câu: <b id="q">1 / 20</b></div><div class="stat"><span class="big">⭐</span>Điểm: <b id="score">0</b></div><div class="stat"><span class="big">🏆</span>Level <b id="level">1</b><small id="levelName">Hợp âm trưởng cơ bản</small></div><div class="stat"><span class="big">❤️ ❤️ 🤍</span></div></div>
</section></div>
<script>
const whites=["C4","D4","E4","F4","G4","A4","B4","C5","D5","E5","F5","G5","A5","B5","C6"];
const blackSpecs=[["C#4",1],["D#4",2],["F#4",4],["G#4",5],["A#4",6],["C#5",8],["D#5",9],["F#5",11],["G#5",12],["A#5",13]];
const chords={C:["C4","E4","G4"],D:["D4","F#4","A4"],E:["E4","G#4","B4"],F:["F4","A4","C5"],G:["G4","B4","D5"],A:["A4","C#5","E5"],Am:["A4","C5","E5"],Dm:["D4","F4","A4"],Em:["E4","G4","B4"],Cm:["C4","D#4","G4"],Fm:["F4","G#4","C5"],Gm:["G4","A#4","D5"]};
const names={C:"Đô trưởng",D:"Rê trưởng",E:"Mi trưởng",F:"Fa trưởng",G:"Sol trưởng",A:"La trưởng",Am:"La thứ",Dm:"Rê thứ",Em:"Mi thứ",Cm:"Đô thứ",Fm:"Fa thứ",Gm:"Sol thứ"};
const major=["C","D","E","F","G","A"];
const minor=["Am","Cm","Dm","Em","Fm","Gm"];
const mixedPool=[...major,...minor];
const levels=[{name:"Trưởng & thứ",notes:mixedPool},{name:"Trưởng & thứ",notes:mixedPool},{name:"Trưởng & thứ",notes:mixedPool},{name:"Trưởng & thứ",notes:mixedPool},{name:"Trưởng & thứ",notes:mixedPool}];
let level=0,q=1,score=0,current=null,started=false,soundOn=true,audio=null;
const $=id=>document.getElementById(id),random=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>[...a].sort(()=>Math.random()-.5);
function noteClass(n){return "note-"+n.replace(/[0-9]/g,"").replace("#","")}
function drawPiano(){const w=$("whites"),b=$("blacks");w.innerHTML="";b.innerHTML="";whites.forEach(n=>{const e=document.createElement("div");e.className="white "+noteClass(n);e.dataset.note=n;e.textContent=n.replace(/[0-9]/g,"");w.appendChild(e)});blackSpecs.forEach(([n,pos])=>{const e=document.createElement("div");e.className="black";e.dataset.note=n;e.textContent=n.replace(/[0-9]/g,"");e.style.left=(pos/whites.length*100)+"%";b.appendChild(e)})}
function highlight(ns){document.querySelectorAll("[data-note]").forEach(e=>e.classList.toggle("active",ns.includes(e.dataset.note)))}
const freq={C4:261.63,"C#4":277.18,D4:293.66,"D#4":311.13,E4:329.63,F4:349.23,"F#4":369.99,G4:392,"G#4":415.3,A4:440,"A#4":466.16,B4:493.88,C5:523.25,"C#5":554.37,D5:587.33,"D#5":622.25,E5:659.25,F5:698.46,"F#5":739.99,G5:783.99,"G#5":830.61,A5:880,"A#5":932.33,B5:987.77,C6:1046.5,"C#6":1108.73,D6:1174.66,"D#6":1244.51,E6:1318.51};
function initAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio)audio=new AC();if(audio.state==="suspended")audio.resume().catch(()=>{})}
function playChord(ns){if(!soundOn)return;initAudio();if(!audio)return;ns.forEach((n,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.035;o.type="triangle";o.frequency.value=freq[n]||440;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.8);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.85)})}
function beep(ok){if(!soundOn)return;initAudio();if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type="triangle";o.frequency.value=ok?880:180;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.1,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.3)}
function next(){if(q>20)return finish();const data=levels[level];current=random(data.notes);$("q").textContent=q+" / 20";$("level").textContent=level+1;$("levelName").textContent=data.name;$("message").textContent="";$("sub").textContent="Hợp âm trưởng hay thứ? Nghe thật kỹ nhé! 🎧";highlight(chords[current]);playChord(chords[current]);let isMinor=current.endsWith("m");let opposite=isMinor?major:minor;let same=isMinor?minor:major;let opts=[current];while(opts.length<2){let x=random(same);if(!opts.includes(x))opts.push(x)}while(opts.length<4){let x=random(opposite);if(!opts.includes(x))opts.push(x)}$("answers").innerHTML="";shuffle(opts).forEach(x=>{const b=document.createElement("button");b.className="choice";b.textContent=names[x];b.onclick=()=>answer(x);$("answers").appendChild(b)})}
function answer(x){const bs=[...document.querySelectorAll(".choice")];if(bs.some(b=>b.disabled))return;bs.forEach(b=>b.disabled=true);const ok=x===current;beep(ok);if(ok){score++;$("score").textContent=score;$("message").textContent=random(["🎉 Chính xác!","🌟 Giỏi lắm!","👏 Tuyệt vời!"]);$("message").className="message correct"}else{$("message").innerHTML="💜 Gần đúng rồi! Đáp án là <b>"+names[current]+"</b>";$("message").className="message wrong"}q++;if(q===5)level=1;else if(q===9)level=2;else if(q===13)level=3;else if(q===17)level=4;setTimeout(next,1000)}
function startGame(){if(started)return;started=true;initAudio();$("start").style.display="none";next()}
function finish(){highlight([]);$("answers").innerHTML="";$("restart").style.display="block";$("sub").textContent=score===20?"🏆 Chord Master!":"🎵 Hoàn thành thử thách!";$("message").innerHTML=`Bạn đạt <b>${score}/20</b> điểm!`;$("message").className="message correct"}
function restart(){level=0;q=1;score=0;started=false;$("score").textContent=0;$("level").textContent=1;$("q").textContent="1 / 20";$("levelName").textContent=levels[0].name;$("message").textContent="";$("restart").style.display="none";$("start").style.display="block";highlight([])}
$("start").onclick=startGame;$("restart").onclick=restart;$("soundBtn").onclick=()=>{soundOn=!soundOn;$("soundBtn").textContent=soundOn?"🔊 Âm thanh":"🔇 Tắt âm thanh";if(soundOn)initAudio()};drawPiano();
</script>
</body></html>
