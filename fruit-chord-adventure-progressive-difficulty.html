<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fruit Chord Adventure</title><style>

r;padding-bottom:27px;font-size:26px;font-weight:1000;z-index:1}.white:last-child{border-right:0}.white:nth-child(7n+1),.white:nth-child(7n+5){color:#6331d4}.white:nth-child(7n+2){color:#2e7de9}.white:nth-child(7n+3){color:#f23c5a}.white:nth-child(7n+4){color:#2caf5b}.white:nth-child(7n+6){color:#f28b00}.white.active{background:linear-gradient(#d4c0ff,#b894f2);box-shadow:inset 0 -7px 0 #713bd9}.blacks{position:absolute;inset:0;pointer-events:none;z-index:4}.black{position:absolute;top:-2px;width:58px;height:130px;transform:translateX(-50%);background:linear-gradient(90deg,#242431,#12121a);border:3px solid #11111a;border-top:0;border-radius:0 0 14px 14px;box-shadow:0 8px 10px #0004;display:flex;align-items:flex-end;justify-content:center;padding-bottom:27px;color:#fff;font-size:17px;font-weight:1000}.black.active{background:linear-gradient(90deg,#b79af5,#8b5ce2);border-color:#7040d1}.instruction{align-self:center;margin:6px auto;padding:5px 18px;border:2px solid #ffd875;border-radius:18px;background:#fffdf4;font-size:16px;font-weight:900}.answers{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 10px}.choice{min-width:0;min-height:62px;border:3px solid transparent;border-radius:18px;box-shadow:0 4px 12px #6d42dc22;font-size:20px;font-weight:1000;cursor:pointer;color:#fff}.choice:nth-child(1){background:#ff6b6b}.choice:nth-child(2){background:#339af0}.choice:nth-child(3){background:#845ef7}.choice:nth-child(4){background:#f3b300;color:#5a4000}.choice.correct{box-shadow:0 0 0 4px #56c879}.choice.wrong{opacity:.45}.message{height:38px;text-align:center;margin:3px 0 0;font-size:17px;font-weight:1000;line-height:1.05;overflow:hidden}.message .feedback-praise{display:block;font-size:18px}.message .feedback-detail{display:block;font-size:13px}.message.correct{color:#24944a}.message.wrong{color:#d63b66}.controls{text-align:center;height:0;overflow:visible;position:relative;top:-18px}.start,.restart{border:0;border-radius:16px;padding:6px 20px;background:#6332d5;color:#fff;font-weight:1000;font-size:15px;cursor:pointer;display:none}.start.show,.restart.show{display:inline-block}.stats{height:54px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;gap:8px;border-top:1px solid #e7dcff;margin:5px 10px 0;padding-top:5px}.stat{text-align:center;font-weight:900;font-size:15px}.stat .big{font-size:21px;margin-right:4px}.stat small{display:block;font-size:10px}@media(max-width:900px){html,body{overflow:auto}.app{height:auto;min-height:100vh;padding:4px 7px}.top{height:70px;flex-basis:70px}.brand-main{font-size:30px}.ribbon{font-size:15px;padding:4px 28px;border-width:3px}.home,.sound{font-size:11px;padding:6px 9px}.panel{padding:6px 4px 8px;overflow:visible}.question h1{font-size:28px}.question p{font-size:14px}.piano-wrap{overflow-x:auto}.piano{height:220px;min-width:1000px}.white{font-size:20px;padding-bottom:24px}.black{width:52px;height:115px;font-size:14px;padding-bottom:23px}.instruction{font-size:13px;padding:4px 9px}.answers{grid-template-columns:repeat(2,1fr);gap:7px;padding:0 2px}.choice{min-height:57px;font-size:15px}.message{height:42px}.message .feedback-praise{font-size:16px}.stats{grid-template-columns:repeat(3,1fr);margin:3px 2px 0}.stat{font-size:13px}.stat small{font-size:9px}}
.timer-wrap{width:min(430px,70%);margin:2px auto 5px;text-align:center}.timer-label{font-size:14px;font-weight:1000;color:#6332d5;margin-bottom:3px}.timer-track{height:8px;background:#eee6ff;border-radius:99px;overflow:hidden;border:1px solid #d9caff}.timer-bar{height:100%;width:100%;background:#7040d8;border-radius:99px;transition:width .1s linear}.timer-bar.warning{background:#f2a900}.timer-bar.danger{background:#e84b63}@media(max-width:900px){.timer-wrap{width:88%}.timer-label{font-size:12px}}</style></head><body><div class="app"><header class="top"><button class="home" onclick="location.reload()">⌂ Trang chủ</button><div class="brand"><div class="brand-main"><span>F</span><span>R</span><span>U</span><span>I</span><span>T</span> <span>CHORD</span></div><div class="ribbon">⭐ ADVENTURE ⭐</div></div><button class="sound" id="soundBtn">🔊 Âm thanh</button></header><section class="panel"><div class="question"><h1>🤔 Đoán xem!</h1><p id="sub">Hợp âm trưởng hay thứ? Nghe thật kỹ nhé! 🎧</p></div><div class="piano-wrap"><div class="piano"><div class="whites" id="whites"></div><div class="blacks" id="blacks"></div></div></div><div class="instruction">⭐ Nhìn các phím sáng và chọn tên hợp âm nhé! 👀</div>
<div class="timer-wrap" id="timerWrap"><div class="timer-label">⏱️ Thời gian: <b id="timer">10</b>s</div><div class="timer-track"><div class="timer-bar" id="timerBar"></div></div></div><div class="answers" id="answers"></div><div class="message" id="message"></div><div class="controls"><button class="start show" id="start">▶ Bắt đầu chơi</button><button class="restart" id="restart">🔄 Chơi lại</button></div><div class="stats"><div class="stat">🎯 Câu: <b id="q">1 / 20</b></div><div class="stat">⭐ Điểm: <b id="score">0</b></div><div class="stat">🎹 <b>Trưởng & thứ</b><small>Nghe và phân biệt</small></div></div></section></div><script>
const whites=["C4","D4","E4","F4","G4","A4","B4","C5","D5","E5","F5","G5","A5","B5","C6","D6","E6"];const blackSpecs=[["C#4",1],["D#4",2],["F#4",4],["G#4",5],["A#4",6],["C#5",8],["D#5",9],["F#5",11],["G#5",12],["A#5",13],["C#6",15],["D#6",16]];const chords={C:["C4","E4","G4"],D:["D4","F#4","A4"],E:["E4","G#4","B4"],F:["F4","A4","C5"],G:["G4","B4","D5"],A:["A4","C#5","E5"],Am:["A4","C5","E5"],Cm:["C4","D#4","G4"],Dm:["D4","F4","A4"],Em:["E4","G4","B4"],Fm:["F4","G#4","C5"],Gm:["G4","A#4","D5"]};const names={C:"Đô trưởng",D:"Rê trưởng",E:"Mi trưởng",F:"Fa trưởng",G:"Sol trưởng",A:"La trưởng",Am:"La thứ",Cm:"Đô thứ",Dm:"Rê thứ",Em:"Mi thứ",Fm:"Fa thứ",Gm:"Sol thứ"};const major=["C","D","E","F","G","A"],minor=["Am","Cm","Dm","Em","Fm","Gm"],pool=[...major,...minor];let q=1,score=0,current=null,started=false,soundOn=true,audio=null,timerId=null,timerEnd=0,timerSeconds=10;const $=id=>document.getElementById(id),random=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>a.sort(()=>Math.random()-.5);function buildPiano(){whites.forEach(n=>{let d=document.createElement("div");d.className="white";d.dataset.note=n;d.textContent=n[0];$("whites").appendChild(d)});blackSpecs.forEach(([n,s])=>{let d=document.createElement("div");d.className="black";d.dataset.note=n;d.textContent=n.replace(/[0-9]/g,"");d.style.left=`calc(${s} * (100% / ${whites.length}))`;$('blacks').appendChild(d)})}function highlight(ns){document.querySelectorAll('.white,.black').forEach(k=>k.classList.toggle('active',ns.includes(k.dataset.note)))}function initAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}const midi={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};function hz(n){let m=n.match(/^([A-G]#?)(\d)$/);return 440*Math.pow(2/1,((midi[m[1]]+(+m[2]+1)*12)-69)/12)}function tone(f,t,d,v=.09){if(!soundOn||!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.03)}function playChord(ns){initAudio();let t=audio.currentTime+.03;ns.forEach((n,i)=>tone(hz(n),t+i*.018,1.15))}function beep(ok){initAudio();let t=audio.currentTime+.01;tone(ok?880:190,t,.24,.12);if(ok)tone(1175,t+.08,.22,.08)}const praise=['🌟 Giỏi lắm!','🎉 Chính xác rồi!','👏 Tuyệt vời!','🥳 Bạn nghe rất tốt!','✨ Quá chuẩn!'],enc=['💪 Không sao, mình thử lại nhé!','🌱 Gần đúng rồi, cố lên!','🎵 Nghe lại thật kỹ nhé!','😊 Sai một chút thôi, mình học tiếp nào!','💜 Cố lên! Lần sau sẽ nhận ra ngay!'];function getTimeLimit(){return q<=5?10:q<=10?8:q<=15?6:4}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function startTimer(){
  stopTimer();timerSeconds=getTimeLimit();timerEnd=Date.now()+timerSeconds*1000;
  $('timer').textContent=timerSeconds;$('timerBar').style.width='100%';$('timerBar').className='timer-bar';
  timerId=setInterval(()=>{
    let left=Math.max(0,timerEnd-Date.now()),sec=Math.ceil(left/1000),pct=left/(timerSeconds*1000)*100;
    $('timer').textContent=sec;$('timerBar').style.width=pct+'%';
    $('timerBar').className='timer-bar'+(pct<=35?' danger':pct<=60?' warning':'');
    if(left<=0){stopTimer();timeoutAnswer()}
  },50)
}
function updateDifficulty(){
  let level=q<=5?1:q<=10?2:q<=15?3:4;
  let hint=q<=5?'Dễ • 10 giây / câu':q<=10?'Vừa • 8 giây / câu':q<=15?'Khó • 6 giây / câu':'Thử thách • 4 giây / câu';
  $('level').textContent='Level '+level;$('levelHint').textContent=hint
}
function timeoutAnswer(){
  let bs=[...document.querySelectorAll('.choice')];if(bs.some(b=>b.disabled))return;
  bs.forEach(b=>b.disabled=true);beep(false);
  let cb=bs.find(b=>b.textContent===names[current]);if(cb)cb.classList.add('correct');
  $('message').className='message wrong';
  $('message').innerHTML='<span class="feedback-praise">⏰ Hết giờ! Không sao, mình thử lại nhé!</span><span class="feedback-detail">Đáp án đúng là <b>'+names[current]+'</b> 🎹</span>';
  q++;setTimeout(next,1500)
}
function next(){
  if(q>20){finish();return}
  $('q').textContent=q+' / 20';$('message').innerHTML='';$('message').className='message';updateDifficulty();
  current=random(pool);highlight(chords[current]);playChord(chords[current]);
  let isMin=minor.includes(current),same=isMin?minor:major,opp=isMin?major:minor,opts=[current];
  while(opts.length<2){let x=random(same);if(!opts.includes(x))opts.push(x)}
  while(opts.length<4){let x=random(opp);if(!opts.includes(x))opts.push(x)}
  $('answers').innerHTML='';
  shuffle(opts).forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=names[x];b.onclick=()=>answer(x,b);$('answers').appendChild(b)});
  startTimer()
}
function answer(x,clicked){stopTimer();let bs=[...document.querySelectorAll('.choice')];if(bs.some(b=>b.disabled))return;bs.forEach(b=>b.disabled=true);let ok=x===current;beep(ok);bs.forEach(b=>{if(b.textContent===names[current])b.classList.add('correct');if(b===clicked&&!ok)b.classList.add('wrong')});$('message').className='message '+(ok?'correct':'wrong');$('message').innerHTML=`<span class="feedback-praise">${random(ok?praise:enc)}</span><span class="feedback-detail">${ok?'Đúng rồi! Đây là':'Đáp án đúng là'} <b>${names[current]}</b> 🎹</span>`;if(ok)score++;$('score').textContent=score;q++;setTimeout(next,1500)}function finish(){stopTimer();$('timer').textContent='✓';$('timerBar').style.width='0%';highlight([]);$('answers').innerHTML='';$('start').classList.remove('show');$('restart').classList.add('show');$('sub').textContent=score===20?'🏆 Chord Master!':'🎵 Hoàn thành thử thách!';$('message').className='message correct';$('message').innerHTML=`<span class="feedback-praise">👏 Bạn đạt <b>${score}/20</b> điểm!</span><span class="feedback-detail">Mỗi lần chơi lại là thêm một chút giỏi hơn nhé!</span>`}function restart(){stopTimer();q=1;score=0;current=null;$('score').textContent='0';$('q').textContent='1 / 20';$('message').innerHTML='';$('message').className='message';$('restart').classList.remove('show');$('start').classList.add('show');highlight([])}$('start').onclick=()=>{if(started)return;started=true;$('start').classList.remove('show');initAudio();next()};$('restart').onclick=()=>{started=false;restart()};$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊 Âm thanh':'🔇 Tắt âm thanh';if(soundOn)initAudio()};buildPiano();
</script></body></html>
