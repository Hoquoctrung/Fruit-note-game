<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Fruit Piano Challenge</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(180deg,#7048e8,#9775fa);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:12px;
overflow-x:hidden;
}

.game{
width:100%;
max-width:900px;
background:white;
border-radius:35px;
padding:20px;
text-align:center;
transition:.3s;
box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.swipe{
transform:translateX(25px);
opacity:.5;
}

.title{
font-size:42px;
font-weight:bold;
color:#5f3dc4;
margin-bottom:10px;
}

.score{
font-size:24px;
margin-top:10px;
}

.timer{
font-size:42px;
font-weight:bold;
margin-top:10px;
color:#e03131;
transition:.2s;
}

.warning{
animation:blink .5s infinite;
transform:scale(1.1);
}

@keyframes blink{

0%{opacity:1;}
50%{opacity:.2;}
100%{opacity:1;}

}

.staff-wrap{
width:100%;
overflow:hidden;
display:flex;
justify-content:center;
}

svg{
width:100%;
max-width:680px;
height:auto;
overflow:visible;
margin-top:20px;
}

.choices{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:20px;
}

button{
border:none;
border-radius:24px;
padding:20px;
font-size:28px;
font-weight:bold;
cursor:pointer;
color:white;
-webkit-tap-highlight-color:transparent;
touch-action:manipulation;
user-select:none;
min-height:95px;
}

.choice:nth-child(1){
background:#ff6b6b;
}

.choice:nth-child(2){
background:#339af0;
}

.choice:nth-child(3){
background:#845ef7;
}

.choice:nth-child(4){
background:#fab005;
}

.start{
background:#2b8a3e;
margin-top:25px;
width:100%;
}

.message{
margin-top:20px;
font-size:30px;
font-weight:bold;
min-height:70px;
}

.correct{
color:#2b8a3e;
}

.wrong{
color:#d6336c;
}

@media(max-width:700px){

.title{
font-size:30px;
}

.score{
font-size:20px;
}

.timer{
font-size:34px;
}

button{
font-size:22px;
padding:18px 10px;
}

.game{
padding:15px;
border-radius:25px;
}

}

</style>
</head>

<body>

<div class="game" id="game">

<div class="title">
🍒🫐🍇🍌 Fruit Piano 🎹
</div>

<div class="score">
⭐ Điểm: <span id="score">0</span>/20
</div>

<div class="score">
🎯 Câu: <span id="question">1</span>/20
</div>

<div class="timer" id="timer">
⏰ READY
</div>

<div class="staff-wrap">

<svg viewBox="0 0 700 320">

<line x1="100" y1="70" x2="600" y2="70" stroke="black" stroke-width="3"/>
<line x1="100" y1="100" x2="600" y2="100" stroke="black" stroke-width="3"/>
<line x1="100" y1="130" x2="600" y2="130" stroke="black" stroke-width="3"/>
<line x1="100" y1="160" x2="600" y2="160" stroke="black" stroke-width="3"/>
<line x1="100" y1="190" x2="600" y2="190" stroke="black" stroke-width="3"/>

<text x="120" y="175" font-size="120">𝄞</text>

<ellipse
id="note"
cx="420"
cy="130"
rx="18"
ry="13"
fill="#5f3dc4"
/>

<line
id="stem"
x1="435"
y1="130"
x2="435"
y2="60"
stroke="#5f3dc4"
stroke-width="5"
/>

<line
id="ledger"
x1="390"
y1="210"
x2="450"
y2="210"
stroke="black"
stroke-width="3"
style="display:none;"
/>

</svg>

</div>

<div class="choices" id="choices"></div>

<div class="message" id="message"></div>

<button class="start" id="startBtn">
▶ START GAME
</button>

</div>

<script>

const notes = [

{name:"Do4", y:220, ledger:true, weight:1},
{name:"Re4", y:205, weight:1},
{name:"Mi4", y:190, weight:1},
{name:"Fa4", y:175, weight:1},
{name:"Sol4", y:160, weight:2},
{name:"La4", y:145, weight:2},
{name:"Si4", y:130, weight:2},
{name:"Do5", y:115, weight:3},
{name:"Re5", y:100, weight:3},
{name:"Mi5", y:85, weight:4},
{name:"Fa5", y:70, weight:5},
{name:"Sol5", y:55, ledger:false, weight:6}

];

const levels = [
{time:25},
{time:20},
{time:15},
{time:10}
];

const praises = [
"🌟 Giỏi lắm!",
"🎉 Chính xác!",
"👏 Tuyệt vời!",
"🥳 Hay quá!",
"✨ Xuất sắc!"
];

const encourages = [
"💜 Không sao!",
"🌈 Thử lại nhé!",
"✨ Gần đúng rồi!",
"🎵 Cố lên!"
];

let score = 0;
let q = 1;
let current;
let timer;
let timeLeft;

function weighted(){

let pool=[];

notes.forEach(n=>{

for(let i=0;i<n.weight;i++){

pool.push(n);

}

});

return pool[
Math.floor(Math.random()*pool.length)
];

}

function levelIndex(){

if(q<=5) return 0;
if(q<=10) return 1;
if(q<=15) return 2;
return 3;

}

function play(freq,dur){

const ctx =
new (window.AudioContext ||
window.webkitAudioContext)();

const osc = ctx.createOscillator();
const gain = ctx.createGain();

osc.frequency.value=freq;

osc.connect(gain);
gain.connect(ctx.destination);

gain.gain.value=.12;

osc.start();

osc.stop(ctx.currentTime+dur);

}

function clap(){

const audio = new Audio(
"https://actions.google.com/sounds/v1/human_voices/applause.ogg"
);

audio.play();

}

function vibrateGood(){

if(navigator.vibrate){

navigator.vibrate(80);

}

}

function vibrateBad(){

if(navigator.vibrate){

navigator.vibrate([120,80,120]);

}

}

function draw(note){

const noteEl =
document.getElementById("note");

const stem =
document.getElementById("stem");

const ledger =
document.getElementById("ledger");

noteEl.setAttribute(
"cy",
note.y
);

noteEl.setAttribute(
"transform",
`rotate(-20 420 ${note.y})`
);

stem.setAttribute(
"x1",
435
);

stem.setAttribute(
"x2",
435
);

stem.setAttribute(
"y1",
note.y
);

stem.setAttribute(
"y2",
note.y - 70
);

if(note.ledger){

ledger.style.display="block";

ledger.setAttribute(
"y1",
note.y
);

ledger.setAttribute(
"y2",
note.y
);

}else{

ledger.style.display="none";

}



}

function updateTimer(){

const t =
document.getElementById("timer");

t.innerHTML =
`⏰ ${timeLeft}s`;

if(timeLeft<=3){

t.classList.add("warning");

play(1400,.1);

}else{

t.classList.remove("warning");

}

}

function next(){

clearInterval(timer);

if(q>20){

finish();
return;

}

document.getElementById("question")
.innerText=q;

document.getElementById("message")
.innerHTML="";

const game =
document.getElementById("game");

game.classList.add("swipe");

setTimeout(()=>{

game.classList.remove("swipe");

},200);

current = weighted();

draw(current);

let answers=[current.name];

while(answers.length<4){

let r =
notes[
Math.floor(Math.random()*notes.length)
].name;

if(!answers.includes(r)){

answers.push(r);

}

}

answers.sort(()=>Math.random()-.5);

const choices =
document.getElementById("choices");

choices.innerHTML="";

answers.forEach(a=>{

const btn =
document.createElement("button");

btn.className="choice";

btn.innerText=a;

btn.onclick=()=>check(a);

choices.appendChild(btn);

});

timeLeft =
levels[levelIndex()].time;

updateTimer();

timer = setInterval(()=>{

timeLeft--;

updateTimer();

if(timeLeft<=0){

clearInterval(timer);

wrong("⏰ Hết giờ!");

}

},1000);

}

function good(msg){

play(1000,.2);

vibrateGood();

document.getElementById("message")
.innerHTML=msg;

document.getElementById("message")
.className="message correct";

}

function wrong(msg){

play(220,.3);

vibrateBad();

document.getElementById("message")
.innerHTML=msg;

document.getElementById("message")
.className="message wrong";

q++;

setTimeout(next,1200);

}

function check(ans){

clearInterval(timer);

if(ans===current.name){

score++;

document.getElementById("score")
.innerText=score;

good(
praises[
Math.floor(Math.random()*praises.length)
]
);

}else{

wrong(
encourages[
Math.floor(Math.random()*encourages.length)
]
+ "<br>Đáp án là " + current.name
);

return;

}

q++;

setTimeout(next,1000);

}

function finish(){

clearInterval(timer);

document.getElementById("choices")
.innerHTML="";

document.getElementById("timer")
.innerHTML="🏁 Finished";

if(score===20){

clap();

document.getElementById("message")
.innerHTML=
"👏👏👏<br>20/20 PERFECT!";

}else{

document.getElementById("message")
.innerHTML=
"🌈 Bé được " + score + "/20 điểm!";

}

}

document
.getElementById("startBtn")
.onclick = async () => {

if(document.documentElement.requestFullscreen){

document.documentElement.requestFullscreen();

}

const ctx =
new (window.AudioContext ||
window.webkitAudioContext)();

await ctx.resume();

document.getElementById("startBtn")
.style.display="none";

next();

};

document.addEventListener(
"touchstart",
function(){},
{passive:true}
);

</script>

</body>
</html>
